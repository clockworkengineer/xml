[package]
name = "xml_lib_rust"
version = "1.2.0"
edition = "2021"
authors = ["ClockworkEngineer", "Rust Port Team"]
description = "Full-featured XML parser, validator, stringifier, and XPath 1.0 engine in pure Rust"
license = "MIT"
repository = "https://github.com/clockworkengineer/xml"
documentation = "https://docs.rs/xml_lib_rust"
readme = "../README.md"

[features]
default = ["std", "dtd", "xsd", "xpath", "stringify"]
std = ["alloc"]
alloc = []
dtd = []
xsd = []
xpath = []
stringify = []
embedded = []
small_nodes = []

[dependencies]
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[example]]
name = "analyze_file"
path = "../examples/analyze_file.rs"

[[example]]
name = "create_at_runtime"
path = "../examples/create_at_runtime.rs"

[[example]]
name = "deep_nesting"
path = "../examples/deep_nesting.rs"

[[example]]
name = "dtd_validation"
path = "../examples/dtd_validation.rs"

[[example]]
name = "encoding"
path = "../examples/encoding.rs"

[[example]]
name = "entity_reference"
path = "../examples/entity_reference.rs"

[[example]]
name = "fibonacci"
path = "../examples/fibonacci.rs"

[[example]]
name = "large_attributes"
path = "../examples/large_attributes.rs"

[[example]]
